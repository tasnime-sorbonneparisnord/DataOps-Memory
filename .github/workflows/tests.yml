name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      # Pygame sans écran ni carte son : les tests de l'interface tournent sur le serveur
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (pytest + pygame)
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  scala:
    # Extension Scala : contrôle qualité des incidents (fr et en) et ses tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: VirtusLab/scala-cli-setup@v1

      - name: Run Scala tests
        run: scala-cli run scala --main-class dataops.quality.runQualityTests

      - name: Check the incident files
        run: scala-cli run scala --main-class dataops.quality.checkIncidents
